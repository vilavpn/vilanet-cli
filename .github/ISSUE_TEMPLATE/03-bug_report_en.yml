name: Bug report (English)
description: Report a reproducible bug in the VilaNet command-line client (vilanet-cli).
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        **Please fill in every required field.**

        VilaNet CLI is a command-line tool. The most important thing here is not a screenshot — it is **the exact command you ran** plus **the full terminal output / logs**. A written description without the command and output is very hard to act on.

  - type: dropdown
    id: platform
    attributes:
      label: Operating system
      description: Which OS are you seeing the bug on? **Please pick manually — do not leave the placeholder selected.**
      options:
        - "⚠️ Please select an OS (leaving this counts as an invalid submission and will be closed)"
        - Linux
        - macOS
        - Windows
    validations:
      required: true

  - type: dropdown
    id: arch
    attributes:
      label: CPU architecture
      description: "Check with `uname -m` (Windows: System Information). **Please pick manually.**"
      options:
        - "⚠️ Please select an architecture (leaving this counts as an invalid submission and will be closed)"
        - amd64 / x86_64
        - arm64 (Apple Silicon or ARM64)
        - armv7
    validations:
      required: true

  - type: input
    id: os_version
    attributes:
      label: OS version
      description: "Linux: `uname -sr`; macOS: `sw_vers`; Windows: run `winver`."
      placeholder: "e.g. Ubuntu 24.04 / macOS 14.4 / Windows 11 23H2"
    validations:
      required: true

  - type: input
    id: cli_version
    attributes:
      label: CLI version
      description: "Paste the output of `vilanet-cli version` (or `vilanet-cli --version`)."
      placeholder: "e.g. v0.1.3 (go1.26.2 linux/amd64)"
    validations:
      required: true

  - type: dropdown
    id: install_source
    attributes:
      label: Install method
      description: How did you install it? **Please pick manually — do not leave the placeholder selected.**
      options:
        - "⚠️ Please select an install method (leaving this counts as an invalid submission and will be closed)"
        - GitHub Release archive (.tar.gz / .zip)
        - Built from source
        - systemd service (Linux)
        - LaunchAgent (macOS)
        - Windows Service
        - Other
    validations:
      required: true

  - type: dropdown
    id: mode
    attributes:
      label: Run mode
      description: |
        Which mode are you running in? TUN mode needs privileges (Linux: `setcap`; macOS: `sudo` on first run). If this is about exit code 5 (missing TUN privileges), choose TUN.
      options:
        - "⚠️ Please select a run mode (leaving this counts as an invalid submission and will be closed)"
        - TUN mode (needs admin / network privileges)
        - SOCKS / proxy only
        - Not sure
    validations:
      required: true

  - type: input
    id: command
    attributes:
      label: Command you ran (required)
      description: Write out the exact command you actually ran.
      placeholder: "e.g. vilanet-cli connect --node \"Tokyo 01\""
    validations:
      required: true

  - type: input
    id: exit_code
    attributes:
      label: Exit code (optional)
      description: |
        If the command failed, give the exit code. Reference: 0 success / 1 generic error / 2 auth failed / 3 account closed / 4 rate-limited or no credentials / 5 missing TUN privileges / 9 --background not supported on this platform.
      placeholder: "e.g. 5"
    validations:
      required: false

  - type: textarea
    id: description
    attributes:
      label: Description
      description: What is the bug? What did you see?
      placeholder: "After running connect it stays at \"connecting\" and exits after ~30 seconds..."
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce (required)
      description: |
        **Required — list every step, one per line, in the order you performed them.** Start from login / install and list each command in turn. If we cannot reproduce the bug by following your list, we cannot fix it.
      placeholder: |
        1. vilanet-cli login
        2. vilanet-cli servers
        3. vilanet-cli connect --node "Tokyo 01"
        4. Wait ~30 seconds
        5. See the error described above
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected vs actual behavior
      description: What did you expect to happen, and what actually happened?
      placeholder: |
        Expected: connects successfully and status shows connected.
        Actual: connection hangs and exits with code 5 after ~30 seconds.
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Full command output and logs (required)
      description: |
        **This is the most important field.** Paste the full terminal output and logs.

        Getting logs: live with `vilanet-cli logs --follow`; or the log directory — Linux: `~/.local/state/vilanet/logs/`; macOS: `~/Library/Logs/com.viraltech.vilanet/`; Windows: `%LOCALAPPDATA%\VilaNet\Logs\`.
      render: shell
    validations:
      required: true

  - type: textarea
    id: diag
    attributes:
      label: Diagnostic bundle (optional, strongly recommended)
      description: |
        Running `vilanet-cli diag` produces a **redacted** support bundle (.tar.gz, safe to share). Drag the generated file here, or paste its path.
      placeholder: "Drag the .tar.gz produced by vilanet-cli diag here."
    validations:
      required: false

  - type: checkboxes
    id: integrity
    attributes:
      label: Integrity checklist
      description: Please check every item.
      options:
        - label: "I searched existing issues and confirmed this is not a duplicate."
          required: true
        - label: "I am using the latest released version."
          required: true
        - label: "I attached the exact command and the full terminal output / logs."
          required: true
        - label: "I wrote out the reproduction steps one by one, in order, not just a summary."
          required: true
        - label: "My reproduction steps do not depend on private account credentials that only I have."
          required: true
