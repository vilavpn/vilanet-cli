name: 问题反馈（中文）
description: 反馈一个可以重现的 VilaNet 命令行客户端（vilanet-cli）问题。
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        **请认真填写每一个必填项。**

        VilaNet CLI 是命令行工具。这里最重要的不是截图，而是：**你运行的完整命令** + **完整的终端输出 / 日志**。仅有文字描述、没有命令和输出的反馈非常难以处理。

  - type: dropdown
    id: platform
    attributes:
      label: 操作系统
      description: 你在哪个系统上遇到这个问题？**请手动选择，不要保留默认占位符。**
      options:
        - "⚠️ 请选择操作系统（保留此项会被视为无效提交并关闭）"
        - Linux
        - macOS
        - Windows
    validations:
      required: true

  - type: dropdown
    id: arch
    attributes:
      label: CPU 架构
      description: "可用 `uname -m` 查看（Windows 见「系统信息」）。**请手动选择，不要保留默认占位符。**"
      options:
        - "⚠️ 请选择架构（保留此项会被视为无效提交并关闭）"
        - amd64 / x86_64
        - arm64（Apple Silicon 或 ARM64）
        - armv7
    validations:
      required: true

  - type: input
    id: os_version
    attributes:
      label: 系统版本
      description: "Linux：`uname -sr`；macOS：`sw_vers`；Windows：运行 `winver`。"
      placeholder: "例如：Ubuntu 24.04 / macOS 14.4 / Windows 11 23H2"
    validations:
      required: true

  - type: input
    id: cli_version
    attributes:
      label: CLI 版本
      description: "粘贴 `vilanet-cli version`（或 `vilanet-cli --version`）的输出。"
      placeholder: "例如：v0.1.3 (go1.26.2 linux/amd64)"
    validations:
      required: true

  - type: dropdown
    id: install_source
    attributes:
      label: 安装方式
      description: 你是怎么安装的？**请手动选择，不要保留默认占位符。**
      options:
        - "⚠️ 请选择安装方式（保留此项会被视为无效提交并关闭）"
        - GitHub Release 压缩包（.tar.gz / .zip）
        - 从源码编译
        - systemd 服务（Linux）
        - LaunchAgent（macOS）
        - Windows 服务
        - 其他
    validations:
      required: true

  - type: dropdown
    id: mode
    attributes:
      label: 运行模式
      description: |
        你以哪种模式运行？TUN 模式需要权限（Linux 需 `setcap`，macOS 首次需 `sudo`）。如果是退出码 5（缺少 TUN 权限）相关问题，请选 TUN。
      options:
        - "⚠️ 请选择运行模式（保留此项会被视为无效提交并关闭）"
        - TUN 模式（需要管理员 / 网络权限）
        - 仅 SOCKS / 代理模式
        - 不确定
    validations:
      required: true

  - type: input
    id: command
    attributes:
      label: 你运行的命令（必填）
      description: 请写出你实际运行的完整命令。
      placeholder: "例如：vilanet-cli connect --node \"Tokyo 01\""
    validations:
      required: true

  - type: input
    id: exit_code
    attributes:
      label: 退出码（可选）
      description: |
        如果命令失败，请填写退出码。参考：0 成功 / 1 通用错误 / 2 认证失败 / 3 账号已关闭 / 4 限流或无凭据 / 5 缺少 TUN 权限 / 9 当前平台不支持 --background。
      placeholder: "例如：5"
    validations:
      required: false

  - type: textarea
    id: description
    attributes:
      label: 问题描述
      description: 具体遇到了什么问题？你看到了什么？
      placeholder: "运行 connect 后一直停在「connecting」，约 30 秒后退出……"
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: 重现步骤（必填）
      description: |
        **必填 — 请按你实际操作的顺序，每一步一行。** 从登录 / 安装开始，依次列出每一条命令。如果我们无法按你的步骤重现问题，就无法修复。
      placeholder: |
        1. vilanet-cli login
        2. vilanet-cli servers
        3. vilanet-cli connect --node "Tokyo 01"
        4. 等待约 30 秒
        5. 出现上面描述的错误
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 预期行为 vs 实际行为
      description: 你期望发生什么？实际发生了什么？
      placeholder: |
        预期：连接成功，status 显示 connected。
        实际：连接卡住，约 30 秒后以退出码 5 退出。
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: 完整命令输出与日志（必填）
      description: |
        **这是最重要的一项。** 请粘贴完整的终端输出，以及日志。

        获取日志：实时查看用 `vilanet-cli logs --follow`；或打开日志目录 —— Linux：`~/.local/state/vilanet/logs/`；macOS：`~/Library/Logs/com.viraltech.vilanet/`；Windows：`%LOCALAPPDATA%\VilaNet\Logs\`。
      render: shell
    validations:
      required: true

  - type: textarea
    id: diag
    attributes:
      label: 诊断包（可选，强烈推荐）
      description: |
        运行 `vilanet-cli diag` 会生成一个**已脱敏**的支持包（.tar.gz，可安全分享）。请把生成的文件拖到这里，或粘贴其路径。
      placeholder: "把 vilanet-cli diag 生成的 .tar.gz 拖到这里。"
    validations:
      required: false

  - type: checkboxes
    id: integrity
    attributes:
      label: 完整性声明
      description: 请勾选下面每一项。
      options:
        - label: "我已搜索并确认此问题不是重复提交。"
          required: true
        - label: "我正在使用最新发布的版本。"
          required: true
        - label: "我已附上完整的命令和完整的终端输出 / 日志。"
          required: true
        - label: "我按顺序逐条写出了重现步骤，而不是只写一句概述。"
          required: true
        - label: "我的重现步骤不依赖只有我才有的私密账号凭据。"
          required: true
