name: バグ報告（日本語）
description: 再現可能な VilaNet コマンドラインクライアント（vilanet-cli）の不具合を報告します。
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        **すべての必須項目を必ず記入してください。**

        VilaNet CLI はコマンドラインツールです。ここで最も重要なのはスクリーンショットではなく、**実行したコマンド全文** と **ターミナル出力 / ログ全文** です。コマンドと出力のない文章だけの報告は対応が非常に困難です。

  - type: dropdown
    id: platform
    attributes:
      label: OS
      description: どの OS で問題が発生しましたか？**プレースホルダーのままにせず、必ず手動で選択してください。**
      options:
        - "⚠️ OS を選択してください（未選択のままは無効な投稿として扱われ、クローズされます）"
        - Linux
        - macOS
        - Windows
    validations:
      required: true

  - type: dropdown
    id: arch
    attributes:
      label: CPU アーキテクチャ
      description: "`uname -m` で確認できます（Windows は「システム情報」）。**必ず手動で選択してください。**"
      options:
        - "⚠️ アーキテクチャを選択してください（未選択のままは無効な投稿として扱われ、クローズされます）"
        - amd64 / x86_64
        - arm64（Apple Silicon または ARM64）
        - armv7
    validations:
      required: true

  - type: input
    id: os_version
    attributes:
      label: OS バージョン
      description: "Linux：`uname -sr`／macOS：`sw_vers`／Windows：`winver` を実行。"
      placeholder: "例：Ubuntu 24.04 / macOS 14.4 / Windows 11 23H2"
    validations:
      required: true

  - type: input
    id: cli_version
    attributes:
      label: CLI バージョン
      description: "`vilanet-cli version`（または `vilanet-cli --version`）の出力を貼り付けてください。"
      placeholder: "例：v0.1.3 (go1.26.2 linux/amd64)"
    validations:
      required: true

  - type: dropdown
    id: install_source
    attributes:
      label: インストール方法
      description: どのようにインストールしましたか？**プレースホルダーのままにせず、必ず手動で選択してください。**
      options:
        - "⚠️ インストール方法を選択してください（未選択のままは無効な投稿として扱われ、クローズされます）"
        - GitHub Release のアーカイブ（.tar.gz / .zip）
        - ソースからビルド
        - systemd サービス（Linux）
        - LaunchAgent（macOS）
        - Windows サービス
        - その他
    validations:
      required: true

  - type: dropdown
    id: mode
    attributes:
      label: 動作モード
      description: |
        どのモードで実行していますか？TUN モードには権限が必要です（Linux は `setcap`、macOS は初回 `sudo`）。終了コード 5（TUN 権限不足）に関する問題なら TUN を選択してください。
      options:
        - "⚠️ 動作モードを選択してください（未選択のままは無効な投稿として扱われ、クローズされます）"
        - TUN モード（管理者 / ネットワーク権限が必要）
        - SOCKS / プロキシのみ
        - わからない
    validations:
      required: true

  - type: input
    id: command
    attributes:
      label: 実行したコマンド（必須）
      description: 実際に実行したコマンド全文を記入してください。
      placeholder: "例：vilanet-cli connect --node \"Tokyo 01\""
    validations:
      required: true

  - type: input
    id: exit_code
    attributes:
      label: 終了コード（任意）
      description: |
        コマンドが失敗した場合は終了コードを記入してください。参考：0 成功 / 1 一般エラー / 2 認証失敗 / 3 アカウント閉鎖 / 4 レート制限または資格情報なし / 5 TUN 権限不足 / 9 このプラットフォームでは --background 非対応。
      placeholder: "例：5"
    validations:
      required: false

  - type: textarea
    id: description
    attributes:
      label: 不具合の説明
      description: 具体的に何が起きましたか？何を目にしましたか？
      placeholder: "connect 実行後ずっと「connecting」のままで、約 30 秒後に終了する……"
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: 再現手順（必須）
      description: |
        **必須 — 実際に行った順番どおりに、1 行に 1 ステップずつ記入してください。** ログイン / インストールから始め、実行したコマンドを順に挙げてください。手順どおりに再現できなければ修正できません。
      placeholder: |
        1. vilanet-cli login
        2. vilanet-cli servers
        3. vilanet-cli connect --node "Tokyo 01"
        4. 約 30 秒待つ
        5. 上記のエラーが発生
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 期待する動作 vs 実際の動作
      description: 何が起きると期待し、実際には何が起きましたか？
      placeholder: |
        期待：接続成功し、status が connected になる。
        実際：接続が止まり、約 30 秒後に終了コード 5 で終了する。
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: コマンド出力とログ全文（必須）
      description: |
        **これが最も重要な項目です。** ターミナル出力全文とログを貼り付けてください。

        ログの取得：リアルタイムは `vilanet-cli logs --follow`／またはログディレクトリ —— Linux：`~/.local/state/vilanet/logs/`、macOS：`~/Library/Logs/com.viraltech.vilanet/`、Windows：`%LOCALAPPDATA%\VilaNet\Logs\`。
      render: shell
    validations:
      required: true

  - type: textarea
    id: diag
    attributes:
      label: 診断バンドル（任意・強く推奨）
      description: |
        `vilanet-cli diag` を実行すると、**機微情報を除去した**サポートバンドル（.tar.gz、共有しても安全）が生成されます。生成されたファイルをここにドラッグするか、パスを貼り付けてください。
      placeholder: "vilanet-cli diag で生成された .tar.gz をここにドラッグしてください。"
    validations:
      required: false

  - type: checkboxes
    id: integrity
    attributes:
      label: 確認事項
      description: 以下のすべての項目にチェックを入れてください。
      options:
        - label: "既存の Issue を検索し、重複でないことを確認しました。"
          required: true
        - label: "最新リリース版を使用しています。"
          required: true
        - label: "コマンド全文とターミナル出力 / ログ全文を添付しました。"
          required: true
        - label: "再現手順を概要ではなく、順番どおり 1 つずつ記入しました。"
          required: true
        - label: "再現手順は、自分だけが持つ非公開のアカウント資格情報に依存していません。"
          required: true
